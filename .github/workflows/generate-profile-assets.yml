name: Generate Profile Assets

on:
  schedule:
    # 毎日日本時間の午前0時に実行
    - cron: "0 15 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 画像を入れるための「dist」フォルダを作成
      - run: mkdir -p dist

      # 2. Snakeの生成（distフォルダに出力される）
      - name: Generate snake files
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 3. Statsの生成（これもdistフォルダに出力する）
      - name: Generate Stats Card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=nord&count_private=true&hide_border=true
          path: dist/stats.svg
          token: ${{ secrets.PAT_1 }}

      # 4. Top Langsの生成（これもdistフォルダに出力する）
      - name: Generate Top Languages Card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=nord&hide_border=true&card_width=320
          path: dist/top-langs.svg
          token: ${{ secrets.PAT_1 }}

      # 5. まとめてプッシュ！
      # distフォルダの中身（SnakeとStatsの計4枚の画像）だけで
      # outputブランチを綺麗に上書きする
      - name: Push all assets to the output branch
        uses: crazy-max/ghaction-github-pages@v4.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}